<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Satoshi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1 {
            text-align: center;
            color: #e94560;
            margin-bottom: 20px;
            font-size: 28px;
        }
        h2 {
            color: #e94560;
            margin-bottom: 12px;
            font-size: 20px;
        }
        input, button {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input {
            background: #16213e;
            color: #eee;
            border: 1px solid #0f3460;
        }
        button {
            background: #e94560;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active {
            background: #c73e54;
        }
        .server-card {
            background: #16213e;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid #0f3460;
            transition: border 0.2s;
        }
        .server-card:active {
            border-color: #e94560;
        }
        .server-name {
            font-size: 17px;
            font-weight: bold;
        }
        .server-info {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }
        #chat-box {
            background: #16213e;
            border-radius: 8px;
            padding: 12px;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 14px;
            border: 1px solid #0f3460;
        }
        .chat-msg {
            margin-bottom: 6px;
            word-break: break-word;
        }
        .chat-msg .user {
            color: #e94560;
            font-weight: bold;
        }
        .chat-msg .time {
            color: #666;
            font-size: 11px;
            margin-left: 6px;
        }
        .error {
            color: #e94560;
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .success {
            color: #4ecca3;
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .top-bar button {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            background: #0f3460;
        }
        .badge {
            background: #e94560;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<!-- ЭКРАН ЛОГИНА -->
<div id="screen-auth" class="screen active">
    <h1>🎯 SATOSHI</h1>
    <div id="auth-error" class="error"></div>
    <input type="text" id="username" placeholder="Логин" autocomplete="username">
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
    <button onclick="login()">Войти</button>
    <button onclick="register()" style="background:#0f3460;">Создать аккаунт</button>
</div>

<!-- ЭКРАН СПИСКА СЕРВЕРОВ -->
<div id="screen-lobby" class="screen">
    <div class="top-bar">
        <h2>🎯 SATOSHI</h2>
        <button onclick="logout()">Выйти</button>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:12px;">
        <input type="text" id="server-name" placeholder="Название лобби" style="flex:1;">
        <input type="text" id="server-mode" placeholder="Режим" style="flex:1;">
    </div>
    <input type="text" id="server-map" placeholder="Карта" style="margin-bottom:12px;">
    <button onclick="createServer()">Создать лобби</button>
    <h2 style="margin-top:20px;">Серверы</h2>
    <div id="servers-list">Загрузка...</div>
</div>

<!-- ЭКРАН ЛОББИ -->
<div id="screen-game" class="screen">
    <div class="top-bar">
        <button onclick="leaveLobby()">← Назад</button>
        <span id="lobby-title" style="font-weight:bold; color:#e94560;"></span>
        <span></span>
    </div>
    <div id="lobby-info" style="font-size:13px; color:#aaa; margin-bottom:8px;"></div>
    <div id="players-list" style="margin-bottom:12px; font-size:14px;"></div>
    <div id="chat-box"></div>
    <div style="display:flex; gap:8px;">
        <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
        <button onclick="sendMessage()" style="width:auto; padding:14px 20px;">➤</button>
    </div>
</div>

<script>
// ==================== СОСТОЯНИЕ ====================
let token = localStorage.getItem('satoshi_token') || '';
let username = localStorage.getItem('satoshi_user') || '';
let socket = null;
let currentLobby = null;

// ==================== ПОКАЗ ЭКРАНОВ ====================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// ==================== АВТО-ВХОД ====================
if (token && username) {
    showScreen('screen-lobby');
    connectSocket();
    loadServers();
}

// ==================== АВТОРИЗАЦИЯ ====================
async function login() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) return showError('Заполни все поля');
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            token = data.token;
            username = u;
            localStorage.setItem('satoshi_token', token);
            localStorage.setItem('satoshi_user', username);
            showScreen('screen-lobby');
            connectSocket();
            loadServers();
        } else {
            showError(data.error || 'Ошибка входа');
        }
    } catch (e) {
        showError('Сервер недоступен');
    }
}

async function register() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    if (!u || !p) return showError('Заполни все поля');
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            showError('');
            document.getElementById('auth-error').className = 'success';
            document.getElementById('auth-error').textContent = 'Аккаунт создан! Теперь войди';
        } else {
            showError(data.error || 'Ошибка регистрации');
        }
    } catch (e) {
        showError('Сервер недоступен');
    }
}

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.className = 'error';
    el.textContent = msg;
}

function logout() {
    token = '';
    username = '';
    localStorage.clear();
    if (socket) socket.disconnect();
    showScreen('screen-auth');
}

// ==================== SOCKET.IO ====================
function connectSocket() {
    if (socket) socket.disconnect();
    socket = io({ query: { token, username } });
    
    socket.on('connect', () => console.log('Socket connected'));
    
    socket.on('server-created', (server) => {
        loadServers();
    });
    
    socket.on('server-removed', (data) => {
        loadServers();
    });
    
    socket.on('player-joined', (data) => {
        if (currentLobby && data.serverId === currentLobby.id) {
            addChatMessage('system', `${data.username} зашёл в лобби`);
            refreshLobbyInfo();
        }
    });
    
    socket.on('player-left', (data) => {
        if (currentLobby && data.serverId === currentLobby.id) {
            addChatMessage('system', `${data.username} вышел из лобби`);
            refreshLobbyInfo();
        }
    });
    
    socket.on('lobby-message', (data) => {
        if (currentLobby && data.serverId === currentLobby.id) {
            addChatMessage(data.username, data.message);
        }
    });
}

// ==================== СЕРВЕРЫ ====================
async function loadServers() {
    try {
        const res = await fetch('/api/servers', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const servers = await res.json();
        const container = document.getElementById('servers-list');
        if (!servers.length) {
            container.innerHTML = '<p style="color:#aaa; text-align:center;">Нет активных серверов</p>';
            return;
        }
        container.innerHTML = servers.map(s => `
            <div class="server-card" onclick="joinServer('${s.id}')">
                <div class="server-name">${escapeHtml(s.name)}</div>
                <div class="server-info">
                    ${escapeHtml(s.mode || '?')} | ${escapeHtml(s.map || '?')} | 
                    ${s.players || 0} игроков | ${escapeHtml(s.hostName || 'хост')}
                </div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('servers-list').innerHTML = '<p style="color:#e94560;">Ошибка загрузки</p>';
    }
}

async function createServer() {
    const name = document.getElementById('server-name').value.trim();
    const mode = document.getElementById('server-mode').value.trim();
    const map = document.getElementById('server-map').value.trim();
    
    if (!name) return alert('Введи название лобби');
    
    try {
        const res = await fetch('/api/servers', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, mode, map })
        });
        if (res.ok) {
            document.getElementById('server-name').value = '';
            document.getElementById('server-mode').value = '';
            document.getElementById('server-map').value = '';
            loadServers();
        }
    } catch (e) {
        alert('Ошибка создания сервера');
    }
}

async function joinServer(serverId) {
    try {
        const res = await fetch('/api/servers', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const servers = await res.json();
        currentLobby = servers.find(s => s.id === serverId);
        
        if (!currentLobby) return;
        
        document.getElementById('lobby-title').textContent = currentLobby.name;
        document.getElementById('lobby-info').innerHTML = `
            Режим: ${escapeHtml(currentLobby.mode || '?')} | 
            Карта: ${escapeHtml(currentLobby.map || '?')}
        `;
        document.getElementById('chat-box').innerHTML = '';
        document.getElementById('chat-input').value = '';
        
        showScreen('screen-game');
        
        socket.emit('join-lobby', { serverId });
        
        refreshLobbyInfo();
    } catch (e) {
        alert('Ошибка подключения');
    }
}

function refreshLobbyInfo() {
    // Запрашиваем game-info для получения списка игроков
    socket.emit('request-game-info', { serverId: currentLobby?.id });
    
    socket.once('game-info', (data) => {
        if (data.players) {
            document.getElementById('players-list').innerHTML = 
                '🎮 Игроки: ' + data.players.map(p => escapeHtml(p)).join(', ');
        }
    });
}

function leaveLobby() {
    if (currentLobby) {
        socket.emit('leave-lobby', { serverId: currentLobby.id });
    }
    currentLobby = null;
    showScreen('screen-lobby');
    loadServers();
}

// ==================== ЧАТ ====================
function sendMessage() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg || !currentLobby) return;
    
    socket.emit('lobby-message', {
        serverId: currentLobby.id,
        message: msg
    });
    
    addChatMessage(username, msg);
    input.value = '';
}

function addChatMessage(user, msg) {
    const box = document.getElementById('chat-box');
    const time = new Date().toLocaleTimeString().slice(0, 5);
    const cls = user === 'system' ? 'style="color:#666;"' : '';
    box.innerHTML += `<div class="chat-msg"><span class="user">${escapeHtml(user)}</span><span class="time">${time}</span><br><span ${cls}>${escapeHtml(msg)}</span></div>`;
    box.scrollTop = box.scrollHeight;
}

document.getElementById('chat-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
});

// ==================== УТИЛИТЫ ====================
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
