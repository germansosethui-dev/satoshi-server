<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Satoshi</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000; color: #b0b0b0; min-height: 100vh;
            max-width: 500px; margin: 0 auto; padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { text-align: center; color: #ff0000; margin-bottom: 20px; font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 15px #ff0000, 0 0 30px #cc0000; }
        h2 { color: #ff0000; margin-bottom: 12px; font-size: 19px; text-shadow: 0 0 8px #ff0000; }
        h3 { color: #888; margin-bottom: 10px; font-size: 15px; }
        input, button, select { width: 100%; padding: 13px; margin-bottom: 10px; border-radius: 6px; border: none; font-size: 15px; }
        input, select { background: #0a0a0a; color: #ccc; border: 1px solid #1a1a1a; transition: all 0.3s; }
        input:focus, select:focus { outline: none; border-color: #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3); }
        button { background: #cc0000; color: white; font-weight: bold; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 10px rgba(255,0,0,0.4), 0 0 20px rgba(255,0,0,0.2); text-transform: uppercase; letter-spacing: 1px; }
        button:active { background: #990000; box-shadow: 0 0 20px rgba(255,0,0,0.6), 0 0 40px rgba(255,0,0,0.3); transform: scale(0.98); }
        .btn-secondary { background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 0 0 8px rgba(255,0,0,0.2); }
        .btn-danger { background: #1a0000; border: 1px solid #330000; box-shadow: 0 0 8px rgba(255,0,0,0.3); }
        .card { background: #050505; padding: 13px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #111; }
        .msg { text-align: center; margin-bottom: 8px; font-size: 13px; }
        .error { color: #ff0000; text-shadow: 0 0 8px rgba(255,0,0,0.5); }
        .success { color: #00cc00; text-shadow: 0 0 8px rgba(0,255,0,0.5); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #111; }
        .top-bar button { width: auto; padding: 7px 14px; font-size: 13px; background: #0a0a0a; border: 1px solid #1a1a1a; box-shadow: 0 0 8px rgba(255,0,0,0.15); }
        .tab-bar { display: flex; gap: 6px; margin-bottom: 14px; }
        .tab-bar button { flex: 1; padding: 9px; font-size: 12px; background: #050505; border: 1px solid #111; box-shadow: none; }
        .tab-bar button.active { background: #cc0000; border-color: #cc0000; box-shadow: 0 0 12px rgba(255,0,0,0.5); }
        #chat-box { background: #050505; border-radius: 6px; padding: 10px; height: 220px; overflow-y: auto; margin-bottom: 8px; font-size: 13px; border: 1px solid #111; }
        .chat-msg { margin-bottom: 5px; word-break: break-word; }
        .chat-msg .user { color: #ff0000; font-weight: bold; }
        .chat-msg .time { color: #333; font-size: 10px; margin-left: 4px; }
        .queue-info { background: #050505; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; border: 1px solid #111; }
        label { font-size: 12px; color: #666; display: block; margin-bottom: 3px; }
        .divider { border-top: 1px solid #111; margin: 16px 0; }
        .logo { font-size: 40px; text-align: center; margin-bottom: 4px; text-shadow: 0 0 20px #ff0000, 0 0 40px #cc0000; animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #cc0000; } 50% { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff3333, 0 0 80px #cc0000; } }
    </style>
</head>
<body>

<div id="screen-auth" class="screen active">
    <div class="logo">🎯</div>
    <h1>SATOSHI</h1>
    <div id="auth-msg" class="msg"></div>
    <div id="login-form">
        <h3>ВХОД</h3>
        <input type="text" id="login-username" placeholder="Логин">
        <input type="password" id="login-password" placeholder="Пароль">
        <button id="btn-login">ВОЙТИ</button>
        <button id="btn-show-register" class="btn-secondary">СОЗДАТЬ АККАУНТ</button>
    </div>
    <div id="register-form" style="display:none;">
        <h3>РЕГИСТРАЦИЯ</h3>
        <input type="text" id="reg-username" placeholder="Логин">
        <input type="password" id="reg-password" placeholder="Пароль">
        <input type="text" id="reg-nick" placeholder="Ник в игре">
        <input type="text" id="reg-gameid" placeholder="ID в Standoff 2">
        <button id="btn-register">ЗАРЕГИСТРИРОВАТЬСЯ</button>
        <button id="btn-show-login" class="btn-secondary">← НАЗАД КО ВХОДУ</button>
    </div>
</div>

<div id="screen-main" class="screen">
    <div class="top-bar">
        <span style="color:#ff0000; font-weight:bold; text-shadow: 0 0 10px #ff0000;">🎯 SATOSHI</span>
        <span id="user-nick" style="font-size:13px; color:#777;"></span>
        <button id="btn-logout">ВЫЙТИ</button>
    </div>
    <div class="tab-bar">
        <button id="tab-queue" class="active">🎯 ПОИСК</button>
        <button id="tab-chat">💬 ЧАТ</button>
        <button id="tab-profile">👤 ПРОФИЛЬ</button>
    </div>
    <div id="tab-content-queue">
        <div class="card">
            <label>РЕЖИМ</label>
            <select id="queue-mode"><option value="1v1">1 на 1</option><option value="2v2">2 на 2</option><option value="5v5">5 на 5</option></select>
            <label>ТИП</label>
            <select id="queue-type"><option value="unranked">Обычный</option><option value="ranked">Рейтинговый</option></select>
            <button id="btn-join-queue">🔍 НАЙТИ ИГРУ</button>
            <button id="btn-leave-queue" class="btn-danger" style="display:none;">❌ ОТМЕНИТЬ ПОИСК</button>
        </div>
        <div id="queue-status" class="msg"></div>
        <h3>ИГРОКИ В ОЧЕРЕДИ</h3>
        <div id="queue-list">Загрузка...</div>
    </div>
    <div id="tab-content-chat" style="display:none;">
        <div id="chat-box"></div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="chat-input" placeholder="Сообщение..." style="flex:1;">
            <button id="btn-send-chat" style="width:auto; padding:13px 18px;">➤</button>
        </div>
    </div>
    <div id="tab-content-profile" style="display:none;">
        <div class="card"><h3>МОЯ СТАТИСТИКА</h3><div id="profile-stats">Загрузка...</div></div>
    </div>
</div>

<div id="screen-match" class="screen">
    <h2>⚔️ МАТЧ НАЙДЕН!</h2>
    <div class="card">
        <p id="match-info" style="margin-bottom:8px;"></p>
        <p id="match-timer" style="color:#ff0000; font-size:22px; text-align:center; text-shadow: 0 0 10px #ff0000;"></p>
    </div>
    <button id="btn-accept-match">✅ ПРИНЯТЬ</button>
    <button id="btn-decline-match" class="btn-danger">❌ ОТКЛОНИТЬ</button>
</div>

<script>
(function() {
    var myUserId = localStorage.getItem('satoshi_userId') || '';
    var myUserData = null;
    var socket = null;
    var currentTab = 'queue';
    var inQueue = false;
    var queueMode = '1v1';
    var queueType = 'unranked';
    var currentMatch = null;
    var matchTimer = null;
    var matchTimerCount = 15;

    function showScreen(id) {
        var screens = document.getElementsByClassName('screen');
        for (var i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
    }

    function switchTab(tab) {
        currentTab = tab;
        var btns = document.querySelectorAll('.tab-bar button');
        for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('active'); }
        var btn = document.getElementById('tab-' + tab);
        if (btn) btn.classList.add('active');
        var contents = document.querySelectorAll('[id^="tab-content-"]');
        for (var j = 0; j < contents.length; j++) { contents[j].style.display = 'none'; }
        var content = document.getElementById('tab-content-' + tab);
        if (content) content.style.display = 'block';
        if (tab === 'profile') updateProfileStats();
    }

    function showRegister() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
        var m = document.getElementById('auth-msg'); if (m) { m.textContent = ''; m.className = 'msg'; }
    }

    function showLogin() {
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
        var m = document.getElementById('auth-msg'); if (m) { m.textContent = ''; m.className = 'msg'; }
    }

    function login() {
        var u = document.getElementById('login-username').value.trim();
        var p = document.getElementById('login-password').value.trim();
        if (!u || !p) { showAuthMsg('Заполни все поля', 'error'); return; }
        fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        }).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success) { myUserId = d.userData.id; myUserData = d.userData; localStorage.setItem('satoshi_userId', myUserId); enterApp(); }
            else { showAuthMsg(d.message || 'Неверный логин или пароль', 'error'); }
        }).catch(function() { showAuthMsg('Сервер недоступен', 'error'); });
    }

    function register() {
        var u = document.getElementById('reg-username').value.trim();
        var p = document.getElementById('reg-password').value.trim();
        var n = document.getElementById('reg-nick').value.trim();
        var g = document.getElementById('reg-gameid').value.trim();
        if (!u || !p || !n || !g) { showAuthMsg('Все поля обязательны', 'error'); return; }
        fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p, inGameNick: n, inGameId: g })
        }).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success) {
                showAuthMsg('Аккаунт создан! ID: ' + d.userId, 'success');
                document.getElementById('login-username').value = u;
                document.getElementById('login-password').value = p;
                setTimeout(showLogin, 1500);
            } else { showAuthMsg(d.message || 'Ошибка регистрации', 'error'); }
        }).catch(function() { showAuthMsg('Сервер недоступен', 'error'); });
    }

    function showAuthMsg(msg, cls) {
        var el = document.getElementById('auth-msg'); if (!el) return;
        el.textContent = msg; el.className = 'msg ' + cls;
    }

    function logout() {
        if (socket) socket.disconnect();
        localStorage.clear(); myUserId = ''; myUserData = null; showScreen('screen-auth');
    }

    function enterApp() {
        showScreen('screen-main');
        var nick = document.getElementById('user-nick');
        if (nick) nick.textContent = myUserData ? myUserData.inGameNick : myUserId;
        connectSocket(); switchTab('queue');
    }

    function connectSocket() {
        if (socket) socket.disconnect();
        socket = io();
        socket.on('connect', function() { socket.emit('auth', myUserId); });
        socket.on('queueUpdate', function(q) { displayQueues(q); });
        socket.on('chatHistory', function(msgs) {
            var box = document.getElementById('chat-box'); if (!box) return; box.innerHTML = '';
            if (msgs) for (var i = 0; i < msgs.length; i++) { var m = msgs[i]; addChatMsg(m.user || m.from, m.text || m.message, m.date); }
        });
        socket.on('chatMessage', function(m) { addChatMsg(m.user || m.from, m.text || m.message, m.date); });
        socket.on('matchFound', function(d) {
            currentMatch = d; matchTimerCount = Math.floor((d.timeout || 15000) / 1000);
            var info = document.getElementById('match-info');
            if (info) info.innerHTML = '<b>Режим:</b> ' + d.mode + ' ' + (d.ranked ? '(Рейтинг)' : '(Обычный)') + '<br><b>Карта:</b> ' + d.map + '<br><b>Игроков:</b> ' + d.participants.length;
            showScreen('screen-match'); startMatchTimer();
        });
        socket.on('matchCancelled', function() { resetMatch(); showScreen('screen-main'); setQueueStatus('<span class="error">Матч отменён</span>'); });
        socket.on('queueError', function(d) { setQueueStatus('<span class="error">' + (d.message || 'Ошибка') + '</span>'); });
        socket.on('banned', function(d) { alert('Забанены до ' + new Date(d.until).toLocaleString()); logout(); });
        socket.on('muted', function(d) { setQueueStatus('<span class="error">Замьючены до ' + new Date(d.until).toLocaleString() + '</span>'); });
    }

    function joinQueue() {
        queueMode = document.getElementById('queue-mode').value;
        queueType = document.getElementById('queue-type').value;
        socket.emit('joinQueue', { mode: queueMode, ranked: queueType === 'ranked' });
        inQueue = true;
        document.getElementById('btn-join-queue').style.display = 'none';
        document.getElementById('btn-leave-queue').style.display = 'block';
        setQueueStatus('<span style="color:#ff0000;">🔍 Поиск игры...</span>');
    }

    function leaveQueue() {
        socket.emit('leaveQueue', { mode: queueMode, ranked: queueType === 'ranked' });
        inQueue = false;
        document.getElementById('btn-join-queue').style.display = 'block';
        document.getElementById('btn-leave-queue').style.display = 'none';
        setQueueStatus('');
    }

    function acceptMatch() {
        if (!currentMatch) return;
        socket.emit('acceptMatch', { matchId: currentMatch.id });
        resetMatch();
        showScreen('screen-main');
        setQueueStatus('<span class="success">Матч принят! Заходи в Standoff 2</span>');
    }

    function declineMatch() {
        if (!currentMatch) return;
        socket.emit('declineMatch', { matchId: currentMatch.id });
        resetMatch();
        showScreen('screen-main');
    }

    function resetMatch() {
        clearInterval(matchTimer); currentMatch = null;
        document.getElementById('btn-join-queue').style.display = 'block';
        document.getElementById('btn-leave-queue').style.display = 'none';
        inQueue = false;
    }

    function startMatchTimer() {
        clearInterval(matchTimer);
        var el = document.getElementById('match-timer');
        el.textContent = matchTimerCount + ' сек';
        matchTimer = setInterval(function() {
            matchTimerCount--;
            el.textContent = matchTimerCount + ' сек';
            if (matchTimerCount <= 0) { clearInterval(matchTimer); showScreen('screen-main'); resetMatch(); }
        }, 1000);
    }

    function setQueueStatus(html) {
        var el = document.getElementById('queue-status'); if (el) el.innerHTML = html;
    }

    function displayQueues(queues) {
        var c = document.getElementById('queue-list'); var h = '';
        for (var k in queues) { var q = queues[k]; if (q && q.length) h += '<div class="queue-info"><b>' + k.replace(/_/g, ' → ') + ':</b> ' + q.length + ' игроков</div>'; }
        if (!h) h = '<p style="color:#444;text-align:center;">Очереди пусты</p>';
        c.innerHTML = h;
    }

    function sendChat() {
        var input = document.getElementById('chat-input'); var t = input.value.trim();
        if (!t || !socket) return;
        socket.emit('chatMessage', { text: t }); input.value = '';
    }

    function addChatMsg(user, text, date) {
        var box = document.getElementById('chat-box'); if (!box) return;
        var time = date ? new Date(date).toLocaleTimeString().slice(0,5) : new Date().toLocaleTimeString().slice(0,5);
        var disp = (user === myUserId || user === (myUserData && myUserData.username)) ? 'Я' : (user || 'Аноним');
        box.innerHTML += '<div class="chat-msg"><span class="user">' + esc(disp) + '</span><span class="time">' + time + '</span><br>' + esc(text) + '</div>';
        box.scrollTop = box.scrollHeight;
    }

    function updateProfileStats() {
        if (!myUserData) {
            fetch('/api/user/' + myUserId).then(function(r) { return r.json(); }).then(function(d) {
                if (d.success) { myUserData = d.userData; renderStats(); }
            });
        } else { renderStats(); }
    }

    function renderStats() {
        if (!myUserData) return;
        var s = myUserData.stats;
        document.getElementById('profile-stats').innerHTML =
            '<p><b>Ник:</b> ' + esc(myUserData.inGameNick) + '</p>' +
            '<p><b>ID в игре:</b> ' + esc(myUserData.inGameId) + '</p>' +
            '<p><b>Уровень:</b> ' + getLevel(s.mmr_1v1) + '</p><div class="divider"></div>' +
            '<p><b>1v1:</b> MMR ' + s.mmr_1v1 + ' | Побед: ' + s.wins_1v1 + ' | Поражений: ' + s.losses_1v1 + '</p>' +
            '<p><b>2v2:</b> MMR ' + s.mmr_2v2 + ' | Побед: ' + s.wins_2v2 + ' | Поражений: ' + s.losses_2v2 + '</p>' +
            '<p><b>5v5:</b> MMR ' + s.mmr_5v5 + ' | Побед: ' + s.wins_5v5 + ' | Поражений: ' + s.losses_5v5 + '</p><div class="divider"></div>' +
            '<p><b>Всего рейтинговых побед:</b> ' + s.totalRankedWins + '</p>';
    }

    function getLevel(mmr) {
        if (mmr >= 2001) return '10 (Бог)'; if (mmr >= 1751) return '9'; if (mmr >= 1531) return '8';
        if (mmr >= 1351) return '7'; if (mmr >= 1201) return '6'; if (mmr >= 1051) return '5';
        if (mmr >= 901) return '4'; if (mmr >= 751) return '3'; if (mmr >= 501) return '2'; return '1';
    }

    function esc(text) {
        if (!text) return '';
        var d = document.createElement('div'); d.textContent = String(text); return d.innerHTML;
    }

    // Привязка кнопок
    document.getElementById('btn-login').addEventListener('click', login);
    document.getElementById('btn-register').addEventListener('click', register);
    document.getElementById('btn-show-register').addEventListener('click', showRegister);
    document.getElementById('btn-show-login').addEventListener('click', showLogin);
    document.getElementById('btn-logout').addEventListener('click', logout);
    document.getElementById('btn-join-queue').addEventListener('click', joinQueue);
    document.getElementById('btn-leave-queue').addEventListener('click', leaveQueue);
    document.getElementById('btn-accept-match').addEventListener('click', acceptMatch);
    document.getElementById('btn-decline-match').addEventListener('click', declineMatch);
    document.getElementById('btn-send-chat').addEventListener('click', sendChat);
    document.getElementById('tab-queue').addEventListener('click', function() { switchTab('queue'); });
    document.getElementById('tab-chat').addEventListener('click', function() { switchTab('chat'); });
    document.getElementById('tab-profile').addEventListener('click', function() { switchTab('profile'); });
    document.getElementById('chat-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendChat(); });

    // Автовход
    if (myUserId) {
        fetch('/api/user/' + myUserId).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success) { myUserData = d.userData; enterApp(); }
            else { localStorage.clear(); myUserId = ''; }
        }).catch(function() {});
    }
})();
</script>
</body>
    </html>
