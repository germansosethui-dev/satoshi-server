<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Standoff 2 | Matchmaking</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d1a; color: #eee; min-height: 100vh;
            max-width: 500px; margin: 0 auto; padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        h1 { text-align: center; color: #ff5722; margin-bottom: 20px; font-size: 26px; }
        h2 { color: #ff5722; margin-bottom: 12px; font-size: 19px; }
        h3 { color: #ccc; margin-bottom: 8px; font-size: 15px; }
        input, button, select {
            width: 100%; padding: 13px; margin-bottom: 10px;
            border-radius: 8px; border: none; font-size: 15px;
        }
        input, select { background: #1a1a2e; color: #eee; border: 1px solid #2a2a4a; }
        button { background: #ff5722; color: white; font-weight: bold; cursor: pointer; }
        button:active { background: #e04e1c; }
        .btn-secondary { background: #2a2a4a; }
        .btn-danger { background: #c0392b; }
        .card {
            background: #1a1a2e; padding: 13px; border-radius: 8px;
            margin-bottom: 8px; border: 1px solid #2a2a4a;
        }
        .msg { text-align: center; margin-bottom: 8px; font-size: 13px; }
        .error { color: #ff5722; }
        .success { color: #4caf50; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
        }
        .top-bar button { width: auto; padding: 7px 14px; font-size: 13px; background: #2a2a4a; }
        .tab-bar { display: flex; gap: 6px; margin-bottom: 14px; }
        .tab-bar button { flex: 1; padding: 9px; font-size: 12px; background: #2a2a4a; }
        .tab-bar button.active { background: #ff5722; }
        #chat-box, #lobby-chat {
            background: #1a1a2e; border-radius: 8px; padding: 10px;
            height: 220px; overflow-y: auto; margin-bottom: 8px;
            font-size: 13px; border: 1px solid #2a2a4a;
        }
        .chat-msg { margin-bottom: 5px; word-break: break-word; }
        .chat-msg .user { color: #ff5722; font-weight: bold; }
        .chat-msg .time { color: #555; font-size: 10px; margin-left: 4px; }
        .queue-info {
            background: #1a1a2e; padding: 8px 12px; border-radius: 8px;
            margin-bottom: 8px; font-size: 12px; border: 1px solid #2a2a4a;
        }
        .badge {
            background: #ff5722; color: white; border-radius: 10px;
            padding: 1px 6px; font-size: 10px; margin-left: 3px;
        }
        .player-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 0; border-bottom: 1px solid #2a2a4a;
        }
        .row { display: flex; gap: 8px; }
        .row input, .row select { flex: 1; }
        label { font-size: 12px; color: #aaa; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="screen-auth" class="screen active">
    <h1>🔫 STANDOFF 2</h1>
    <div id="auth-msg" class="msg"></div>

    <!-- Вход -->
    <div id="login-form">
        <h3>Вход</h3>
        <input type="text" id="login-username" placeholder="Логин">
        <input type="password" id="login-password" placeholder="Пароль">
        <button onclick="login()">Войти</button>
        <button class="btn-secondary" onclick="showRegister()">Создать аккаунт</button>
    </div>

    <!-- Регистрация -->
    <div id="register-form" style="display:none;">
        <h3>Регистрация</h3>
        <input type="text" id="reg-username" placeholder="Логин">
        <input type="password" id="reg-password" placeholder="Пароль">
        <input type="text" id="reg-nick" placeholder="Ник в игре">
        <input type="text" id="reg-gameid" placeholder="ID в Standoff 2">
        <button onclick="register()">Зарегистрироваться</button>
        <button class="btn-secondary" onclick="showLogin()">← Назад ко входу</button>
    </div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="screen-main" class="screen">
    <div class="top-bar">
        <span style="color:#ff5722; font-weight:bold;">🔫 STANDOFF 2</span>
        <span id="user-nick" style="font-size:13px;"></span>
        <button onclick="logout()">Выйти</button>
    </div>

    <div class="tab-bar">
        <button id="tab-queue" class="active" onclick="switchTab('queue')">🎯 Поиск</button>
        <button id="tab-chat" onclick="switchTab('chat')">💬 Чат</button>
        <button id="tab-profile" onclick="switchTab('profile')">👤 Профиль</button>
    </div>

    <!-- Вкладка Поиск игры -->
    <div id="tab-content-queue">
        <div class="card">
            <label>Режим</label>
            <select id="queue-mode">
                <option value="1v1">1 на 1</option>
                <option value="2v2">2 на 2</option>
                <option value="5v5">5 на 5</option>
            </select>
            <label>Тип</label>
            <select id="queue-type">
                <option value="unranked">Обычный</option>
                <option value="ranked">Рейтинговый</option>
            </select>
            <button id="btn-join-queue" onclick="joinQueue()">🔍 Найти игру</button>
            <button id="btn-leave-queue" class="btn-danger" style="display:none;" onclick="leaveQueue()">❌ Отменить поиск</button>
        </div>
        <div id="queue-status" class="msg"></div>
        <h3>Игроки в очереди</h3>
        <div id="queue-list">Загрузка...</div>
    </div>

    <!-- Вкладка Чат -->
    <div id="tab-content-chat" style="display:none;">
        <div id="chat-box"></div>
        <div class="row">
            <input type="text" id="chat-input" placeholder="Сообщение...">
            <button onclick="sendChat()" style="width:auto; padding:13px 18px;">➤</button>
        </div>
    </div>

    <!-- Вкладка Профиль -->
    <div id="tab-content-profile" style="display:none;">
        <div class="card">
            <h3>Моя статистика</h3>
            <div id="profile-stats">Загрузка...</div>
        </div>
    </div>
</div>

<!-- ЭКРАН МАТЧ НАЙДЕН -->
<div id="screen-match" class="screen">
    <h2>⚔️ Матч найден!</h2>
    <div class="card">
        <p id="match-info"></p>
        <p id="match-timer" style="color:#ff5722; font-size:20px; text-align:center;"></p>
    </div>
    <button onclick="acceptMatch()">✅ Принять</button>
    <button class="btn-danger" onclick="declineMatch()">❌ Отклонить</button>
</div>

<script>
// ================= СОСТОЯНИЕ =================
let myUserId = localStorage.getItem('s2_userId') || '';
let myUserData = null;
let socket = null;
let currentTab = 'queue';
let inQueue = false;
let queueMode = '1v1';
let queueType = 'unranked';
let currentMatch = null;
let matchTimer = null;
let matchTimerCount = 15;

// ================= ЭКРАНЫ =================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.querySelectorAll('[id^="tab-content-"]').forEach(d => d.style.display = 'none');
    document.getElementById('tab-content-' + tab).style.display = 'block';
}

function showRegister() {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('register-form').style.display = 'block';
    document.getElementById('auth-msg').textContent = '';
}

function showLogin() {
    document.getElementById('register-form').style.display = 'none';
    document.getElementById('login-form').style.display = 'block';
    document.getElementById('auth-msg').textContent = '';
}

// ================= АВТОРИЗАЦИЯ =================
async function login() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!username || !password) return showAuthMsg('Заполни все поля', 'error');

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            myUserId = data.userData.id;
            myUserData = data.userData;
            localStorage.setItem('s2_userId', myUserId);
            enterApp();
        } else {
            showAuthMsg(data.message || 'Неверный логин или пароль', 'error');
        }
    } catch (e) {
        showAuthMsg('Сервер недоступен', 'error');
    }
}

async function register() {
    const username = document.getElementById('reg-username').value.trim();
    const password = document.getElementById('reg-password').value.trim();
    const inGameNick = document.getElementById('reg-nick').value.trim();
    const inGameId = document.getElementById('reg-gameid').value.trim();

    if (!username || !password || !inGameNick || !inGameId) {
        return showAuthMsg('Все поля обязательны', 'error');
    }

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, inGameNick, inGameId })
        });
        const data = await res.json();
        if (data.success) {
            showAuthMsg('Аккаунт создан! ID: ' + data.userId + '. Теперь войди.', 'success');
            showLogin();
            document.getElementById('login-username').value = username;
        } else {
            showAuthMsg(data.message || 'Ошибка регистрации', 'error');
        }
    } catch (e) {
        showAuthMsg('Сервер недоступен', 'error');
    }
}

function showAuthMsg(msg, cls) {
    const el = document.getElementById('auth-msg');
    el.textContent = msg;
    el.className = 'msg ' + cls;
}

function logout() {
    if (socket) socket.disconnect();
    localStorage.clear();
    myUserId = '';
    myUserData = null;
    showScreen('screen-auth');
}

// ================= ВХОД В ПРИЛОЖЕНИЕ =================
function enterApp() {
    showScreen('screen-main');
    document.getElementById('user-nick').textContent = myUserData?.inGameNick || myUserId;
    connectSocket();
    switchTab('queue');
}

// ================= SOCKET.IO =================
function connectSocket() {
    if (socket) socket.disconnect();
    socket = io();

    socket.on('connect', () => {
        socket.emit('auth', myUserId);
        loadQueueState();
    });

    socket.on('queueUpdate', (queues) => {
        displayQueues(queues);
    });

    socket.on('chatHistory', (messages) => {
        const box = document.getElementById('chat-box');
        box.innerHTML = '';
        messages.forEach(m => addChatMsg(m.user || m.from, m.text || m.message, m.date));
    });

    socket.on('chatMessage', (msg) => {
        addChatMsg(msg.user || msg.from, msg.text || msg.message, msg.date);
    });

    socket.on('matchFound', (data) => {
        currentMatch = data;
        matchTimerCount = Math.floor(data.timeout / 1000);
        document.getElementById('match-info').innerHTML = `
            Режим: ${data.mode} ${data.ranked ? '(Рейтинг)' : '(Обычный)'}<br>
            Карта: ${data.map}<br>
            Игроки: ${data.participants.length}
        `;
        showScreen('screen-match');
        startMatchTimer();
    });

    socket.on('matchCancelled', () => {
        currentMatch = null;
        clearInterval(matchTimer);
        showScreen('screen-main');
        document.getElementById('queue-status').innerHTML = '<span class="error">Матч отменён</span>';
    });

    socket.on('queueError', (data) => {
        document.getElementById('queue-status').innerHTML = '<span class="error">' + data.message + '</span>';
    });

    socket.on('banned', (data) => {
        alert('Вы забанены до ' + new Date(data.until).toLocaleString() + '. Причина: ' + data.reason);
        logout();
    });

    socket.on('muted', (data) => {
        document.getElementById('queue-status').innerHTML = '<span class="error">Вы замьючены до ' + new Date(data.until).toLocaleString() + '</span>';
    });
}

// ================= ОЧЕРЕДЬ =================
function joinQueue() {
    queueMode = document.getElementById('queue-mode').value;
    queueType = document.getElementById('queue-type').value;

    socket.emit('joinQueue', { mode: queueMode, ranked: queueType === 'ranked' });
    inQueue = true;
    document.getElementById('btn-join-queue').style.display = 'none';
    document.getElementById('btn-leave-queue').style.display = 'block';
    document.getElementById('queue-status').innerHTML = '<span style="color:#ff5722;">🔍 Поиск игры...</span>';
}

function leaveQueue() {
    socket.emit('leaveQueue', { mode: queueMode, ranked: queueType === 'ranked' });
    inQueue = false;
    document.getElementById('btn-join-queue').style.display = 'block';
    document.getElementById('btn-leave-queue').style.display = 'none';
    document.getElementById('queue-status').innerHTML = '';
}

function acceptMatch() {
    if (!currentMatch) return;
    socket.emit('acceptMatch', { matchId: currentMatch.id });
    clearInterval(matchTimer);
    showScreen('screen-main');
    document.getElementById('queue-status').innerHTML = '<span class="success">Матч принят! Заходи в Standoff 2</span>';
    currentMatch = null;
}

function declineMatch() {
    if (!currentMatch) return;
    socket.emit('declineMatch', { matchId: currentMatch.id });
    clearInterval(matchTimer);
    showScreen('screen-main');
    currentMatch = null;
}

function startMatchTimer() {
    clearInterval(matchTimer);
    const timerEl = document.getElementById('match-timer');
    timerEl.textContent = matchTimerCount;
    matchTimer = setInterval(() => {
        matchTimerCount--;
        timerEl.textContent = matchTimerCount;
        if (matchTimerCount <= 0) {
            clearInterval(matchTimer);
            showScreen('screen-main');
            currentMatch = null;
        }
    }, 1000);
}

function loadQueueState() {
    fetch('/api/user/' + myUserId)
        .then(r => r.json())
        .then(d => {
            if (d.success) {
                myUserData = d.userData;
                document.getElementById('user-nick').textContent = myUserData.inGameNick || myUserId;
                updateProfileStats();
            }
        });
}

function displayQueues(queues) {
    const container = document.getElementById('queue-list');
    let html = '';
    for (const [key, q] of Object.entries(queues)) {
        if (q.length === 0) continue;
        const label = key.replace('_', ' → ');
        html += `<div class="queue-info"><b>${label}:</b> ${q.length} игроков</div>`;
    }
    if (!html) html = '<p style="color:#666; text-align:center;">Очереди пусты</p>';
    container.innerHTML = html;
}

// ================= ЧАТ =================
function sendChat() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    if (socket) socket.emit('chatMessage', { text });
    input.value = '';
}

function addChatMsg(user, text, date) {
    const box = document.getElementById('chat-box');
    const time = date ? new Date(date).toLocaleTimeString().slice(0,5) : new Date().toLocaleTimeString().slice(0,5);
    const displayUser = user === myUserId ? (myUserData?.username || 'Я') : (user || 'Аноним');
    box.innerHTML += `<div class="chat-msg"><span class="user">${esc(displayUser)}</span><span class="time">${time}</span><br>${esc(text)}</div>`;
    box.scrollTop = box.scrollHeight;
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && currentTab === 'chat') {
        sendChat();
    }
});

// ================= ПРОФИЛЬ =================
function updateProfileStats() {
    if (!myUserData) return;
    const s = myUserData.stats;
    document.getElementById('profile-stats').innerHTML = `
        <p><b>Ник:</b> ${esc(myUserData.inGameNick)}</p>
        <p><b>ID:</b> ${esc(myUserData.inGameId)}</p>
        <p><b>MMR 1v1:</b> ${s.mmr_1v1} | Побед: ${s.wins_1v1}</p>
        <p><b>MMR 2v2:</b> ${s.mmr_2v2} | Побед: ${s.wins_2v2}</p>
        <p><b>MMR 5v5:</b> ${s.mmr_5v5} | Побед: ${s.wins_5v5}</p>
        <p><b>Всего рейтинговых побед:</b> ${s.totalRankedWins}</p>
    `;
}

// ================= УТИЛИТЫ =================
function esc(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = String(text);
    return div.innerHTML;
}

// ================= АВТОВХОД =================
if (myUserId) {
    fetch('/api/user/' + myUserId)
        .then(r => r.json())
        .then(d => {
            if (d.success) {
                myUserData = d.userData;
                enterApp();
            }
        })
        .catch(() => {});
}
</script>
</body>
</html>
